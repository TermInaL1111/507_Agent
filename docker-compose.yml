services:
  mysql:
    image: mysql:8.4
    container_name: 507-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ONETIME_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: 507-agent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: 507-agent-backend
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-3}
      DJANGO_API_URL: http://django-user:8001
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_BASE_URL: ${ALIYUN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY}
      SKIP_RERANKER_DOWNLOAD: ${SKIP_RERANKER_DOWNLOAD:-true}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-/opt/models/Qwen3-Reranker-0.6B}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-507-agent}
      DOCUMENTS_DIR: /app/documents
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      django-user:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - ./Training Program:/Training Program:ro
      - ./documents:/app/documents:ro

  django-user:
    build:
      context: ./DjangoUserService
    container_name: 507-agent-django-user
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_DB_HOST: mysql
      DJANGO_DB_PORT: 3306
      DJANGO_DB_NAME: ${DJANGO_DB_NAME}
      DJANGO_DB_USER: ${DJANGO_DB_USER}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_REDIS_CACHE_URL: redis://redis:6379/3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - django_media:/app/media

  frontend:
    build:
      context: ./front
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE}
    container_name: 507-agent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
      - django-user

volumes:
  mysql_data:
  redis_data:
  backend_data:
  django_media:
